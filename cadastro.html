
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — Azeroth</title>
  <link rel="stylesheet" href="public/css/site.css">
</head>
<body>
  <header>
    <nav class="wrap">
      <a class="logo" href="index.html"><img width = 100px src="public\assets\logo.png"></a>
      <div class="links">
        <a href="index.html">Explorar</a>
        <a href="jornada.html">Minha jornada</a>
        <a href="historia.html">Historia</a>
        <a href="jogabilidade.html">Jogabilidade</a>
        <a href="comunidade.html">Comunidade</a>
      </div>
      <div class="actions">
        <button class="primary" onclick="location.href='login.html'">Entrar</button>
      </div>
    </nav>
  </header>

  <main>
    <section style="padding:75px 0;">
      <div class="wrap">
        <div class="box" style="max-width:420px; margin:auto;">
          <h2 style="font-size:32px; margin-bottom:20px;">Criar conta</h2>
          <form onsubmit="demoSubmit(event)">
            <label>Nome de usuário</label>
            <input required placeholder="Seu usuário">
            <label>E-mail</label>
            <input type="email" required placeholder="seu@email.com">
            <label>Senha</label>
            <input type="password" required placeholder="Sua senha">
            <button class="primary" style="width:100%;">Cadastrar</button>
          </form>
          <p class="note" style="margin-top:12px; text-align:center;">
            Já tem conta? <a href="login.html" style="color:var(--gold);">Faça login</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap foot">
      <span>AZEROTH — Criar conta</span>
      <span>Projeto acadêmico independente. Não afiliado à Blizzard Entertainment.</span>
    </div>
  </footer>

  <script>
    function demoSubmit(e) {
      e.preventDefault();
      alert('Demonstração visual: cadastro não conectado.');
    }
  </script>
</body>
</html>
