<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário — Azeroth</title>
  <link rel="stylesheet" href="css/site.css">
</head>

<body>
  <header>
    <nav class="wrap">
      <a class="logo" href="index.html"><img width="100" src="assets/logo.png" alt="Tales of Azeroth"></a>
      <div class="links">
        <a href="index.html">Pagina Inicial</a>
        <a href="jornada.html">Minha jornada</a>
        <a href="historia.html">Historia</a>
        <a href="conteudo.html">Conteúdo</a>
        <a href="classes.html">Classes</a>
      </div>
      <div class="actions">
        <button class="primary" onclick="window.location.href='dashboard/dashboard.html'">Dashboard</button>
        <button onclick="window.location.href='quests.html'">Quests</button>
        <button onclick="deslogar()">Sair</button>
      </div>
    </nav>
  </header>

  <main>
    <section style="padding:75px 0;">
      <div class="wrap">
        <div class="box" style="max-width:900px; margin:auto;">
          <h2 style="font-size:28px; margin-bottom:14px;">Formulário</h2>
          <p class="muted" id="intro">Responda as perguntas abaixo.</p>
          <form id="quizForm" onsubmit="return false;">
            <div id="questions"></div>
            <div id="nav" style="display:flex; gap:8px; margin-top:12px;"></div>
            <div style="display:flex; gap:8px; margin-top:12px;">
              <button type="button" onclick="window.location.href='jornada.html'">Cancelar</button>
            </div>
            <p id="form-msg" class="note" style="margin-top:12px; display:none;"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap foot">
      <span>Tales of azeroth — Formulário</span>
      <span>Projeto acadêmico independente.</span>
    </div>
  </footer>

  <script>
    const questionsContainer = document.getElementById('questions');
    const navContainer = document.getElementById('nav');
    const message = document.getElementById('form-msg');

    let perguntas = [];
    let respostas = [];
    let perguntaAtual = 0;
    const idUsuario = sessionStorage.ID_USUARIO;

    function mostrarMensagem(texto) {
      message.style.display = 'block';
      message.textContent = texto;
    }

    function mostrarPergunta() {
      const pergunta = perguntas[perguntaAtual];
      let alternativasHtml = '';

      for (let i = 0; i < pergunta.alternativas.length; i++) {
        const alternativa = pergunta.alternativas[i];
        let marcada = '';

        if (respostas[perguntaAtual] == alternativa.idAlternativa) {
          marcada = 'checked';
        }
        alternativasHtml += `
          <div>
            <input type="radio" name="resposta"
              id="alternativa${alternativa.idAlternativa}"
              value="${alternativa.idAlternativa}" ${marcada}>
            <label for="alternativa${alternativa.idAlternativa}">
              ${alternativa.titulo}
            </label>
          </div>
        `;
      }

      questionsContainer.innerHTML = `
        <fieldset>
          <legend>${pergunta.enunciado}</legend>
          ${alternativasHtml}
          <div class="muted" style="margin-top:10px">
            Pergunta ${perguntaAtual + 1} de ${perguntas.length}
          </div>
        </fieldset>
      `;

      navContainer.innerHTML = '';

      const botao = document.createElement('button');
      botao.type = 'button';
      botao.className = 'primary';

      if (perguntaAtual === perguntas.length - 1) {
        botao.textContent = 'Enviar respostas';
      } else {
        botao.textContent = 'Próxima pergunta';
      }

      botao.addEventListener('click', avancarFormulario);
      navContainer.appendChild(botao);
    }

    function avancarFormulario() {
      const alternativaEscolhida = document.querySelector(
        'input[name="resposta"]:checked'
      );

      if (alternativaEscolhida === null) {
        mostrarMensagem('Selecione uma alternativa para prosseguir.');
        return;
      }

      respostas[perguntaAtual] = alternativaEscolhida.value;
      message.style.display = 'none';
      if (perguntaAtual < perguntas.length - 1) {
        perguntaAtual++;
        mostrarPergunta();
      } else {
        enviarRespostas();
      }
    }

    async function enviarRespostas() {
      try {
        for (let i = 0; i < perguntas.length; i++) {
          const dadosResposta = {
            id_usuario: idUsuario,
            id_pergunta: perguntas[i].idPergunta,
            id_alternativa: respostas[i]
          };
          const respostaServidor = await fetch('/formulario/resposta', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(dadosResposta)
          });
          if (!respostaServidor.ok) {
            const erro = await respostaServidor.text();
            throw new Error(erro);
          }
        }
        mostrarMensagem('Respostas enviadas com sucesso!');
        setTimeout(function () {
          window.location.href = 'dashboard/dashboard.html';
        }, 1200);
      } catch (erro) {
        console.error(erro);
        mostrarMensagem('Erro ao enviar respostas: ' + erro.message);
      }
    }
    async function carregarPerguntas() {
      const respostaServidor = await fetch('/formulario/perguntas');
      perguntas = await respostaServidor.json();
      respostas = [];
      for (let i = 0; i < perguntas.length; i++) {
        respostas.push(null);
      }
      mostrarPergunta();
    }

    if (!idUsuario) {
      const desejaEntrar = confirm(
        'Você precisa estar logado para responder ao formulário. Deseja entrar agora?'
      );

      if (desejaEntrar) {
        window.location.href = 'cadastro/login.html';
      } else {
        window.location.href = 'index.html';
      }
    } else {
      carregarPerguntas();
    }
  </script>
</body>

</html>
