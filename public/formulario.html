<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário — Azeroth</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header>
    <nav class="wrap">
      <a class="logo" href="index.html"><img width="100px" src="assets/logo.png"></a>
      <div class="links">
        <a href="index.html">Pagina Inicial</a>
        <a href="jornada.html">Minha jornada</a>
        <a href="historia.html">Historia</a>
        <a href="conteudo.html">Conteúdo</a>
        <a href="classes.html">Classes</a>
      </div>
      <div class="actions">
        <button onclick="window.location.href='dashboard/jornada.html'">Dashboard</button>
      </div>
    </nav>
  </header>

  <main>
    <section style="padding:75px 0;">
      <div class="wrap">
        <div class="box" style="max-width:900px; margin:auto;">
          <h2 style="font-size:28px; margin-bottom:14px;">Formulário</h2>
          <p class="muted" id="intro">Responda as perguntas abaixo.</p>
          <form id="quizForm" onsubmit="return false;">
            <div id="questions"></div>
            <div id="nav" style="display:flex; gap:8px; margin-top:12px;"></div>
            <div style="display:flex; gap:8px; margin-top:12px;">
              <button type="button" onclick="window.location.href='jornada.html'">Cancelar</button>
            </div>
            <p id="form-msg" class="note" style="margin-top:12px; display:none;"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap foot">
      <span>Tales of azeroth — Formulário</span>
      <span>Projeto acadêmico independente.</span>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const loggedUserId = sessionStorage.ID_USUARIO;
      const questionsContainerEl = document.getElementById('questions');
      const messageEl = document.getElementById('form-msg');

      if (!loggedUserId) {
        if (confirm('Você precisa estar logado para responder ao formulário. Deseja entrar agora?')) {
          window.location.href = 'cadastro/login.html';
        } else {
          window.location.href = 'index.html';
        }
        return;
      }

      fetch('/formulario/perguntas')
        .then(res => (res.status === 204 ? [] : res.json()))
        .then(serverQuestions => {
          if (!serverQuestions || serverQuestions.length === 0) {
            questionsContainerEl.innerHTML = '<p class="muted">Nenhuma pergunta disponível.</p>';
            return;
          }

          // montar array de perguntas de forma simples
          const questionsList = serverQuestions.map(p => ({
            id: p.idPergunta,
            text: p.enunciado,
            alternatives: p.alternativas.map(a => ({ id: a.idAlternativa, text: a.titulo }))
          }));

          const selectedAnswers = new Array(questionsList.length).fill(null);
          const navContainerEl = document.getElementById('nav');

          function showQuestion(index) {
            const q = questionsList[index];
            questionsContainerEl.innerHTML = `
              <fieldset>
                <legend>${q.text}</legend>
                ${q.alternatives.map(a => `
                  <div>
                    <input type="radio" name="resposta" id="a${a.id}" value="${a.id}" ${selectedAnswers[index] == a.id ? 'checked' : ''}>
                    <label for="a${a.id}">${a.text}</label>
                  </div>
                `).join('')}
                <div class="muted" style="margin-top:10px">Pergunta ${index + 1} de ${questionsList.length}</div>
              </fieldset>
            `;

            navContainerEl.innerHTML = '';
            const actionButton = document.createElement('button');
            actionButton.type = 'button';
            actionButton.className = 'primary';
            actionButton.textContent = index === questionsList.length - 1 ? 'Enviar respostas' : 'Próxima pergunta';
            actionButton.addEventListener('click', () => {
              const selectedOption = questionsContainerEl.querySelector('input[type="radio"]:checked');
              if (!selectedOption) {
                messageEl.style.display = 'block';
                messageEl.textContent = 'Selecione uma alternativa para prosseguir.';
                return;
              }
              messageEl.style.display = 'none';
              selectedAnswers[index] = selectedOption.value;

              if (index < questionsList.length - 1) {
                showQuestion(index + 1);
              } else {
                // verificar todas respondidas
                if (selectedAnswers.some(r => r == null)) {
                  messageEl.style.display = 'block';
                  messageEl.textContent = 'Você precisa responder todas as perguntas antes de enviar.';
                  return;
                }

                // enviar respostas (uma requisição por pergunta)
                const requests = questionsList.map((qItem, pos) => {
                  return fetch('/formulario/resposta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      id_usuario: loggedUserId,
                      id_pergunta: qItem.id,
                      id_alternativa: selectedAnswers[pos]
                    })
                  }).then(res => {
                    if (!res.ok) return res.text().then(t => Promise.reject(t));
                    return res.json();
                  });
                });

                Promise.all(requests).then(() => {
                  messageEl.style.display = 'block';
                  messageEl.textContent = 'Respostas enviadas com sucesso!';
                  setTimeout(() => { window.location.href = 'dashboard/panorama.html'; }, 1200);
                }).catch(err => {
                  console.error(err);
                  messageEl.style.display = 'block';
                  messageEl.textContent = 'Erro ao enviar respostas: ' + err;
                });
              }
            });
            navContainerEl.appendChild(actionButton);
          }

          showQuestion(0);
        })
        .catch(err => {
          console.error(err);
          messageEl.style.display = 'block';
          messageEl.textContent = 'Erro ao carregar perguntas.';
        });
    });
  </script>
</body>
</html>
