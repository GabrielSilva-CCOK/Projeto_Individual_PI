<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário — Azeroth</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header>
    <nav class="wrap">
      <a class="logo" href="index.html"><img width="100px" src="assets/logo.png"></a>
      <div class="links">
        <a href="index.html">Pagina Inicial</a>
        <a href="jornada.html">Minha jornada</a>
        <a href="historia.html">Historia</a>
        <a href="conteudo.html">Conteúdo</a>
        <a href="classes.html">Classes</a>
      </div>
      <div class="actions">
        <button onclick="window.location.href='dashboard/jornada.html'">Dashboard</button>
      </div>
    </nav>
  </header>

  <main>
    <section style="padding:75px 0;">
      <div class="wrap">
        <div class="box" style="max-width:900px; margin:auto;">
          <h2 style="font-size:28px; margin-bottom:14px;">Formulário</h2>
          <p class="muted" id="intro">Responda as perguntas abaixo.</p>
          <form id="quizForm" onsubmit="return false;">
            <div id="questions"></div>
            <div id="nav" style="display:flex; gap:8px; margin-top:12px;"></div>
            <div style="display:flex; gap:8px; margin-top:12px;">
              <button type="button" onclick="window.location.href='jornada.html'">Cancelar</button>
            </div>
            <p id="form-msg" class="note" style="margin-top:12px; display:none;"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap foot">
      <span>Tales of azeroth — Formulário</span>
      <span>Projeto acadêmico independente.</span>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let loggedUserId = sessionStorage.ID_USUARIO;
      let questionsContainer = document.getElementById('questions');
      let navContainer = document.getElementById('nav');
      let messageEl = document.getElementById('form-msg');

      if (!loggedUserId) {
        if (confirm('Você precisa estar logado para responder ao formulário. Deseja entrar agora?')) {
          window.location.href = 'cadastro/login.html';
        } else {
          window.location.href = 'index.html';
        }
        return;
      }

      fetch('/formulario/perguntas').then(function (res) {
        if (res.status === 204) return [];
        return res.json();
      }).then(function (serverQuestions) {

        let listaQuestoes = [];
        for (let i = 0; i < serverQuestions.length; i = i + 1) {
          let p = serverQuestions[i];
          let alts = [];
          for (let j = 0; j < p.alternativas.length; j = j + 1) {
            let a = p.alternativas[j];
            alts.push({ id: a.idAlternativa, text: a.titulo });
          }
          listaQuestoes.push({ id: p.idPergunta, text: p.enunciado, alternativas: alts });
        }

        let selectedAnswers = [];
        for (let i = 0; i < listaQuestoes.length; i = i + 1) selectedAnswers.push(null);

        function CarregarPergunta(index) {
          let q = listaQuestoes[index];
          let alternativasHtml = '';
          for (let k = 0; k < q.alternativas.length; k = k + 1) {
            let a = q.alternativas[k];
            let checked = selectedAnswers[index] == a.id ? ' checked' : '';
            alternativasHtml += `<div><input type="radio" name="resposta" id="a${a.id}" value="${a.id}"${checked}><label for="a${a.id}">${a.text}</label></div>`;
          }

          let html = `<fieldset>
            <legend>${q.text}</legend>
            ${alternativasHtml}
            <div class="muted" style="margin-top:10px">Pergunta ${index + 1} de ${listaQuestoes.length}</div>
          </fieldset>`;

          questionsContainer.innerHTML = html;

          navContainer.innerHTML = '';
          let btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'primary';
          btn.innerText = index === listaQuestoes.length - 1 ? 'Enviar respostas' : 'Próxima pergunta';

          btn.addEventListener('click', function () {
            let radios = document.getElementsByName('resposta');
            let chosen = null;
            for (let r = 0; r < radios.length; r = r + 1) {
              if (radios[r].checked) { chosen = radios[r].value; break; }
            }
            if (!chosen) {
              messageEl.style.display = 'block';
              messageEl.textContent = 'Selecione uma alternativa para prosseguir.';
              return;
            }
            messageEl.style.display = 'none';
            selectedAnswers[index] = chosen;

            if (index < listaQuestoes.length - 1) {
              CarregarPergunta(index + 1);
              return;
            }

            // verificar todas respondidas
            for (let t = 0; t < selectedAnswers.length; t = t + 1) {
              if (selectedAnswers[t] == null) {
                messageEl.style.display = 'block';
                messageEl.textContent = 'Você precisa responder todas as perguntas antes de enviar.';
                return;
              }
            }

            let pos = 0;
            function sendNext() {
              if (pos >= listaQuestoes.length) {
                messageEl.style.display = 'block';
                messageEl.textContent = 'Respostas enviadas com sucesso!';
                setTimeout(function () { window.location.href = 'dashboard/jornada.html'; }, 1200);
                return;
              }
              let qItem = listaQuestoes[pos];
              let payload = { id_usuario: loggedUserId, id_pergunta: qItem.id, id_alternativa: selectedAnswers[pos] };
              fetch('/formulario/resposta', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              }).then(function (r) {
                if (!r.ok) {
                  return r.text().then(function (txt) { throw txt; });
                }
                pos = pos + 1;
                sendNext();
              }).catch(function (err) {
                console.error(err);
                messageEl.style.display = 'block';
                messageEl.textContent = `Erro ao enviar respostas: ${err}`;
              });
            }
            sendNext();
          });

          navContainer.appendChild(btn);
        }

        CarregarPergunta(0);
      })
    });
  </script>
</body>
</html>
