<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quests — Tales of Azeroth</title>
  <link rel="stylesheet" href="css/site.css">
</head>

<body onload="VerificarLogado()">
  <header id="Header">
    <nav class="wrap">
      <a class="logo" href="index.html"><img width="100" src="assets/logo.png" alt="Tales of Azeroth"></a>
      <div class="links">
        <a href="index.html">Pagina Inicial</a>
        <a href="jornada.html">Minha jornada</a>
        <a href="historia.html">Historia</a>
        <a href="conteudo.html">Conteúdo</a>
        <a href="classes.html">Classes</a>
      </div>
      <div class="actions">
        <button class="primary" onclick="window.location.href='dashboard/dashboard.html'">Dashboard</button>
        <button onclick="window.location.href='quests.html'">Quests</button>
        <button onclick="deslogar()">Sair</button>
      </div>
    </nav>
  </header>

  <main>
    <section class="wrap">
      <div class="box quest-box">

        <div class="journal-header">
          <div class="journal-left">
            <img src="assets/quest.jpg" class="journal-icon" alt="Ícone de quest">
            <div class="journal-titles">
              <h1>Registro de Missões</h1>
              <div class="muted">Livro de Quests — Tales of Azeroth</div>
            </div>
          </div>
          <div class="journal-right">
            <div class="journal-stats muted">Missões: <span id="journal-count">0</span></div>
          </div>
        </div>

        <div class="quests-grid">

          <div class="quests-left">
            <h2>Quests</h2>
            <p class="muted">Adicione tarefas e marque quando forem concluídas.</p>

            <div class="progress-wrap">
              <div class="progress">
                <div id="progress-fill" class="progress-fill"></div>
              </div>

              <div id="progress-text" class="muted progress-text">0%</div>
            </div>

            <ul id="quest-list" class="quest-list"></ul>
          </div>

          <aside class="quests-right">
            <div class="form-box">
              <h3>Nova Quest</h3>
              <div class="quest-controls">
                <div class="qc-fields">
                  <input id="ipt_titulo" class="quest-input" placeholder="Título da quest">
                  <input id="ipt_quest" class="quest-input" placeholder="Descrição da quest">
                </div>

                <div class="quest-actions">
                  <button id="btn_adicionar" onclick = "adicionarQuest()"class="primary">Adicionar</button>
                </div>
              </div>
            </div>
          </aside>

        </div>

      </div>
    </section>
  </main>

  <footer>
    <div class="wrap foot">
      <span>Tales of Azeroth — Quests</span>
      <span>Projeto acadêmico independente.</span>
    </div>
  </footer>

  <script>
    var idUsuario = sessionStorage.ID_USUARIO;

    function VerificarLogado() {
      if (!idUsuario) {
        var desejaEntrar = confirm(
          'Você precisa estar logado para responder ao formulário. Deseja entrar agora?'
        );

        if (desejaEntrar) {
          window.location.href = 'cadastro/login.html';
        } else {
          window.location.href = 'index.html';
        }
      } else {
        listarQuests();
      }
    }

    function deslogar() {
      sessionStorage.clear();
      window.location.href = 'index.html';
    }


    function listarQuests() {
      fetch('/quests/listar/' + idUsuario)
        .then(function (resposta) {
          return resposta.json();
        })
        .then(function (quests) {
          mostrarQuests(quests);
        });
    }

    function mostrarQuests(quests) {
      var lista = document.getElementById('quest-list');
      var concluidas = 0;

      lista.innerHTML = '';

      for (var i = 0; i < quests.length; i++) {
        if (quests[i].concluida == 1) {
          concluidas++;
        }
        lista.appendChild(criarItem(quests[i]));
      }

      var porcentagem = 0;
      if (quests.length > 0) {
        porcentagem = Math.round(concluidas / quests.length * 100);
      }

      document.getElementById('journal-count').innerText = quests.length;
      document.getElementById('progress-fill').style.width = porcentagem + '%';
      document.getElementById('progress-text').innerText = porcentagem + '%';
    }

    function criarItem(quest) {
      var li = document.createElement('li');
      li.className = 'quest-item';
      if (quest.concluida == 1) {
        li.classList.add('done');
      }

      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = quest.concluida == 1;
      checkbox.onchange = function () {
        alterarQuest(quest);
      };

      var label = document.createElement('label');
      label.onclick = function () {
        alterarQuest(quest);
      };

      var titulo = document.createElement('strong');
      titulo.innerText = quest.titulo;

      var descricao = document.createElement('div');
      descricao.className = 'ipt_quest';
      descricao.innerText = quest.descricao;

      label.appendChild(titulo);
      label.appendChild(descricao);

      var excluir = document.createElement('button');
      excluir.innerText = 'Excluir';
      excluir.className = 'btn';
      excluir.onclick = function () {
        excluirQuest(quest.idQuest);
      };

      li.appendChild(checkbox);
      li.appendChild(label);
      li.appendChild(excluir);

      return li;
    }

    function adicionarQuest() {
      var titulo = document.getElementById('ipt_titulo').value;
      var descricao = document.getElementById('ipt_quest').value;
      if(!titulo){
        ipt_titulo.focus()
        return
      }
      fetch('/quests/cadastrar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tituloServer: titulo,
          descricaoServer: descricao,
          idUsuarioServer: idUsuario
        })
      }).then(function () {
        document.getElementById('ipt_titulo').value = '';
        document.getElementById('ipt_quest').value = '';
        listarQuests();
      });
    }


    function alterarQuest(quest) {
      var novoValor = 1;
      if (quest.concluida == 1) {
        novoValor = 0;
      }

      fetch('/quests/atualizar/' + quest.idQuest, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ concluidaServer: novoValor })
      }).then(function () {
        listarQuests();
      });
    }

    function excluirQuest(idQuest) {
      fetch('/quests/deletar/' + idQuest, {
        method: 'DELETE'
      }).then(function () {
        listarQuests();
      });
    }

  </script>
</body>

</html>
