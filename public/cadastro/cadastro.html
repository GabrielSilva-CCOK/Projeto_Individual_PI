<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — Azeroth</title>
  <link rel="stylesheet" href="../css/site.css">
</head>

<body onload="VerificarLogado()">
  <header id="Header">
    <nav class="wrap">
      <a class="logo" href="#inicio"><img width=100px src="../assets/logo.png"></a>
      <div class="links">
        <a href="../index.html">Pagina Inicial</a>
        <a href="../jornada.html">Minha jornada</a>
        <a href="../historia.html">Historia</a>
        <a href="../conteudo.html">Conteúdo</a>
        <a href="../classes.html">Classes</a>
      </div>
      <div class="actions">
        <button onclick="window.location.href='login.html'">Entrar</button>
        <button class="primary" onclick="window.location.href='cadastro.html'">Criar conta</button>
      </div>
    </nav>
  </header>
  <main>
    <section style="padding:75px 0;">
      <div class="wrap">
        <div class="box" style="max-width:420px; margin:auto;">
          <h2 style="font-size:32px; margin-bottom:20px;">Criar conta</h2>
          <form onsubmit="event.preventDefault();">
            <label>Nome de usuário</label>
            <input id="ipt_nome" class="input" required placeholder="Seu usuário">

            <label>E-mail</label>
            <input id="ipt_email" type="email" class="input" required placeholder="seu@email.com">

            <label>Senha</label>
            <div class="campo-senha">
              <input id="ipt_senha" type="password" class="input" required placeholder="Sua senha"
                oninput="verificarForca()">
              <button type="button" class="botao-olho" onclick="alternarSenha('ipt_senha', this)">Mostrar</button>
            </div>
            <label>Confirme sua senha</label>
            <div class="campo-senha">
              <input id="ipt_confirmar_senha" type="password" class="input" required placeholder="Confirme a senha">
              <button type="button" class="botao-olho"
                onclick="alternarSenha('ipt_confirmar_senha', this)">Mostrar</button>
            </div>
            <div class="forca-barra">
              <div class="forca-preenchimento" id="forca_barra"></div>
            </div>
            <p class="forca-texto" id="forca_texto"></p>
            <p id="msg_erro" class="error-text" style="display:none"></p>
            <button type="button" onclick="cadastrar()" class="primary" style="width:100%;">Cadastrar</button>
          </form>
          <p class="note" style="margin-top:12px; text-align:center;">
            Já tem conta? <a href="login.html" style="color:var(--gold);">Faça login</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap foot">
      <span>Tales of Azeroth — Criar conta</span>
      <span>Projeto acadêmico independente. Não afiliado à Blizzard Entertainment.</span>
    </div>
  </footer>

  <script>
    function alternarSenha(idCampo, botao) {
      const campo = document.getElementById(idCampo);
      if (campo.type === 'password') {
        campo.type = 'text';
        botao.textContent = 'Ocultar';
      } else {
        campo.type = 'password';
        botao.textContent = 'Mostrar';
      }
    }

    function showError(message) {
      const msg = document.getElementById('msg_erro');
      msg.innerHTML = message;
      msg.style.display = 'block'
    }

    function clearError() {
      const msg = document.getElementById('msg_erro');
      msg.innerHTML = ''
      msg.style.display = 'none'
    }

    function avaliarSenha(senha) {
      senha = senha || ''
      let pontos = 0
      let faltando = []

      if (senha.length >= 8) { pontos++; } else { faltando.push('8 caracteres'); }
      if (/[a-z]/.test(senha) && /[A-Z]/.test(senha)) { pontos++; } else { faltando.push('maiúscula e minúscula'); }
      if (/[0-9]/.test(senha)) { pontos++; } else { faltando.push('número'); }
      if (/[^A-Za-z0-9]/.test(senha)) { pontos++; } else { faltando.push('símbolo'); }

      let nivel;
      if (senha.length < 6 || pontos <= 1) {
        nivel = 'fraca'
      } else if (pontos <= 3) {
        nivel = 'média'
      } else {
        nivel = 'forte'
      }

      return { nivel: nivel, faltando: faltando }
    }

    function verificarForca() {
      const senhaEl = document.getElementById('ipt_senha')
      const barra = document.getElementById('forca_barra')
      const texto = document.getElementById('forca_texto')
      if (!senhaEl || !barra || !texto) return

      const senha = senhaEl.value
      if (!senha) {
        barra.style.width = '0'
        texto.textContent = ''
        return;
      }

      const resultado = avaliarSenha(senha)

      if (resultado.nivel === 'fraca') {
        barra.style.width = '33%'
        barra.style.background = '#e53935'
      } else if (resultado.nivel === 'média') {
        barra.style.width = '66%'
        barra.style.background = '#fbc02d'
      } else {
        barra.style.width = '100%'
        barra.style.background = '#07B875'
      }

      texto.textContent = 'Senha ' + resultado.nivel;
      if (resultado.faltando.length > 0) {
        texto.textContent += ' — falta: ' + resultado.faltando.join(', ')
      }
    }

    function cadastrar() {
      let nomeVar = (ipt_nome.value).trim()
      let emailVar = (ipt_email.value).trim()
      let senhaVar = ipt_senha.value
      let confirmaVar = ipt_confirmar_senha.value

      clearError();
      if (!nomeVar || !emailVar || !senhaVar || !confirmaVar) {
        showError('Preencha todos os campos.')
        return false
      }

      if (!emailVar.includes('@') || !emailVar.includes('.')) {
        showError('Digite um e-mail válido.')
        return false
      }

      if (avaliarSenha(senhaVar).nivel === 'fraca') {
        showError('Sua senha está fraca. Use pelo menos 8 caracteres, com letras maiúsculas e minúsculas, número e símbolo.');
        return false
      }

      if (senhaVar !== confirmaVar) {
        const msg = document.getElementById('msg_erro')
        msg.innerHTML = 'As senhas não coincidem.'
        msg.style.display = 'block'
        document.getElementById('ipt_confirmar_senha')
        return false;
      }

      fetch('/usuarios/cadastrar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nomeServer: nomeVar,
          emailServer: emailVar,
          senhaServer: senhaVar,
        })
      })
        .then(function (resposta) {
          console.log('resposta: ', resposta);

          if (resposta.ok) {
            if (typeof cardErro !== 'undefined' && typeof mensagem_erro !== 'undefined') {
              cardErro.style.display = 'block';
              alert('Cadastro realizado com sucesso! Redirecionando para tela de Login...');
            }

            setTimeout(() => { window.location = 'login.html'; }, 2000);

          } else {
            // tenta mostrar mensagem do servidor
            resposta.text().then(texto => showError(texto || 'Erro ao realizar cadastro.'))
          }
        })
        .catch(function (resposta) {
          console.log('#ERRO: ' + resposta);
          showError('Erro ao conectar com o servidor.');
          finalizarAguardar?.();
        });

      return false;
    }


    function VerificarLogado() {
      let loggedUserId = sessionStorage.ID_USUARIO;
      if (loggedUserId) {
        Header.innerHTML = `
      <nav class="wrap">
        <a class="logo" href="index.html"><img width="100" src="assets/logo.png" alt="Tales of Azeroth"></a>
        <div class="links">
          <a href="index.html">Pagina Inicial</a>
          <a href="jornada.html">Minha jornada</a>
          <a href="historia.html">Historia</a>
          <a href="conteudo.html">Conteúdo</a>
          <a href="classes.html">Classes</a>
        </div>
        <div class="actions">
          <button class="primary" onclick="window.location.href='dashboard/dashboard.html'">Dashboard</button>
          <button onclick="window.location.href='quests.html'">Quests</button>
          <button onclick="deslogar()">Sair</button>
        </div>
      </nav>`

      }
    }
    function deslogar() {
      sessionStorage.clear()
      window.location.href = '../index.html'
    }
  </script>
</body>

</html>
