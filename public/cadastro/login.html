<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Azeroth</title>
  <link rel="stylesheet" href="../css/site.css">
</head>

<body onload = "VerificarLogado()">
  <header id="Header">
  </header>
  <main>
    <section style="padding:75px 0;">
      <div class="wrap">
        <div class="box" style="max-width:420px; margin:auto;">
          <h2 style="font-size:32px; margin-bottom:20px;">Entrar</h2>
          <form>
            <label>Email</label>
            <input id="ipt_email" required placeholder="abcdef123@gmail.com">
            <label>Senha</label>
            <div class="campo-senha">
              <input id="ipt_senha" type="password" class="input" required placeholder="Sua senha">
              <button type="button" class="botao-olho" onclick="alternarSenha('ipt_senha', this)">Mostrar</button>
            </div>
            <p id="msg_login_erro" class="error-text" style="display:none"></p>
            <button type="button" onclick="entrar()" class="primary" style="width:100%;">Entrar</button>
          </form>
          <p class="note" style="margin-top:12px; text-align:center;">
            Ainda não tem conta? <a href="cadastro.html" style="color:var(--gold);">Cadastre-se</a>
          </p>
        </div>
    </section>
  </main>

  <footer>
    <div class="wrap foot">
      <span>Tales of Azeroth — Entrar</span>
      <span>Projeto acadêmico independente. Não afiliado à Blizzard Entertainment.</span>
    </div>
  </footer>
  <script>
    const iptEmail = ipt_email.value
    const iptSenha = ipt_senha.value

    function alternarSenha(idCampo, botao) {
      const campo = document.getElementById(idCampo);
      if (campo.type === 'password') {
        campo.type = 'text';
        botao.textContent = 'Ocultar';
      } else {
        campo.type = 'password';
        botao.textContent = 'Mostrar';
      }
    }

    function showLoginError(message) {
      const msg = document.getElementById('msg_login_erro')
      msg.innerHTML = message;
      msg.style.display = 'block';
    }

    function clearLoginError() {
      const msg = document.getElementById('msg_login_erro')
      msg.innerHTML = '';
      msg.style.display = 'none';
    }

    function entrar() {
      clearLoginError();
      const emailVar = ipt_email.value
      const senhaVar = ipt_senha.value
      if (!emailVar || !senhaVar) {
        showLoginError('Preencha todos os campos.');
        return false;
      }

      console.log('FORM LOGIN: ', emailVar);
      console.log('FORM SENHA: ', senhaVar);

      fetch('/usuarios/autenticar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ emailServer: emailVar, senhaServer: senhaVar })
      })
        .then(function (resposta) {
          console.log('ESTOU NO THEN DO entrar()!');

          if (resposta.ok) {
            resposta.json().then(json => {
              console.log(json);
              sessionStorage.EMAIL_USUARIO = json.email;
              sessionStorage.NOME_USUARIO = json.nome;
              sessionStorage.ID_USUARIO = json.id;
              clearLoginError();
              let desejaFormulario = confirm('Login realizado com sucesso! Deseja preencher o formulário agora?');
              if (desejaFormulario) {
                window.location = '../formulario.html';
              } else {
                window.location = '../index.html';
              }
            });
          } else {
            console.log('Houve um erro ao tentar realizar o login!');
            resposta.text().then(texto => {
              console.error(texto);
              showLoginError(texto || 'Erro ao realizar login.');
            });
          }
        }).catch(function (erro) {
          console.error('Erro no fetch /usuarios/autenticar:', erro);
          showLoginError('Erro ao conectar com o servidor.');
        });

      return false;
    }

    function VerificarLogado() {
      let loggedUserId = sessionStorage.ID_USUARIO;
      if (!loggedUserId) {
        Header.innerHTML = `
        <nav class="wrap">
          <a class="logo" href="#inicio"><img width = 100px src="../assets/logo.png"></a>
            <div class="links">
              <a href="../index.html">Pagina Inicial</a>
              <a href="../jornada.html">Minha jornada</a>
              <a href="../historia.html">Historia</a>
              <a href="../conteudo.html">Conteúdo</a>
              <a href="../classes.html">Classes</a>
            </div>
          <div class="actions">
            <button onclick="window.location.href='login.html'">Entrar</button>
            <button class="primary" onclick="window.location.href='cadastro.html'">Criar conta</button>
          </div>
        </nav>`

      }
      else {
        Header.innerHTML = `
        <nav class="wrap">
          <a class="logo" href="#inicio"><img width = 100px src="assets/logo.png"></a>
            <div class="links">
              <a href="../index.html">Pagina Inicial</a>
              <a href="../jornada.html">Minha jornada</a>
              <a href="../historia.html">Historia</a>
              <a href="../conteudo.html">Conteúdo</a>
              <a href="../classes.html">Classes</a>
            </div>
          <div class="actions">
            <button class="primary" onclick="window.location.href='../dashboard/panorama.html'">Dashboard</button>
            <button onclick="deslogar()">Sair</button>
          </div>
        </nav>`

      }
    }
    function deslogar() {
      sessionStorage.clear()
      window.location.href = '../index.html'
    }
  </script>
</body>

</html>
